<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess the Celebrity 👂</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>👂 Guess the Celebrity</h1>

  <img id="earImage">

  <input id="guessInput" placeholder="Type your guess...">

  <div class="buttons">
    <button onclick="submitGuess()">Submit</button>
    <button onclick="giveHint()">Hint</button>
    <button onclick="reveal()">Reveal</button>
    <button onclick="next()">Next</button>
  </div>

  <div id="feedback"></div>

  <div id="revealBox" class="hidden">
    <img id="fullImage">
    <p id="answer"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

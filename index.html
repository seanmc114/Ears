<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Celebrity Ears</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>👂 Guess the Celebrity</h1>
      <p class="subtitle">Look at the ear. Type your guess. Then reveal the celeb.</p>

      <div class="imageWrap">
        <img id="earImage" src="" alt="Celebrity ear" />
      </div>

      <div class="controls">
        <input
          type="text"
          id="guessInput"
          placeholder="Type celebrity name..."
          autocomplete="off"
        />
      </div>

      <div class="buttons">
        <button id="submitBtn">Submit Guess</button>
        <button id="revealBtn">Reveal</button>
        <button id="nextBtn">Next</button>
      </div>

      <div id="feedback" class="feedback"></div>

      <div id="revealSection" class="reveal hidden">
        <h2>The answer is:</h2>
        <div class="answerName" id="answerText"></div>
        <img id="fullImage" src="" alt="Celebrity reveal" />
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
